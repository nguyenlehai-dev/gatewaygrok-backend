services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-gatewaygrok-api-test}
    ports:
      - "${APP_PORT:-18084}:8000"
      - "${VNC_PORT:-5902}:5901"
    env_file:
      - .env.test
    volumes:
      - ./storage-test:/app/storage-test
    shm_size: "1gb"
    restart: unless-stopped
    command: ["/app/scripts/start_api_env.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
